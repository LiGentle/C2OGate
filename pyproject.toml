[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c2ogate"
version = "0.6.0"
description = "Proof-carrying joint performance estimation for certified branch decisions"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Jintao Li", email = "e0622340@u.nus.edu"},
]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://github.com/LiGentle/C2OGate"
Issues = "https://github.com/LiGentle/C2OGate/issues"

[project.optional-dependencies]
pep = ["cvxpy==1.9.2", "PEPit==0.5.1", "sympy==1.14.0"]
certificates = ["mpmath>=1.3"]
dev = ["pytest==8.3.5", "ruff==0.12.10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
