[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c2ogate"
version = "0.9.0"
description = "Independently verifiable joint performance estimation for continuation decisions"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Jintao Li", email = "e0622340@u.nus.edu"},
]
requires-python = ">=3.11"
dependencies = ["numpy==2.4.6", "matplotlib==3.11.1"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://github.com/LiGentle/C2OGate"
Issues = "https://github.com/LiGentle/C2OGate/issues"

[project.optional-dependencies]
pep = [
    "numpy==2.4.6",
    "cvxpy==1.9.2",
    "clarabel==0.11.1",
    "scs==3.2.11",
    "PEPit==0.5.1",
    "sympy==1.14.0",
]
certificates = ["mpmath==1.3.0"]
dev = ["pytest==8.3.5", "ruff==0.12.10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
